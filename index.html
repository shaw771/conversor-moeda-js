<!DOCTYPE html>
    <html lang="pt-br">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <!-- LINK FONT Google-->
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed&display=swap" rel="stylesheet">
            <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">

            <!-- link style -->
            <link rel="stylesheet" href="style.css">

            <title>DevClub - Convert Money</title>

        </head>
        <body>
            <img class="logo" src="./assets/logo.gif" alt="logo-devclub-convert-money">
            <main>  
                <label>
                    Converter <b>de</b>
                    <select>
                        <option>Real BRasileiro</option>
                    </select>
                </label>

                <label>
                    Converter <b>para</b>
                    <select class="currency-select">
                        <option value="dolar">US$ Dolar americano</option>
                        <option value="euro">€ Euro</option>
                    </select>
                </label>

                <label>
                    Valor
                    <input class="input-currency" placeholder="R$ 10.000,00" type="">
                </label>

                <button class="convert-button">Converter</button>

                <section>
                    <div class="currency-box">
                        <img src="./assets/real.png" alt="logo-moeda-a-converter">
                        <p class="currency">Real</p>
                        <p class="currency-value-to-convert">R$ 0,00</p>
                    </div>
                    
                    <img class="arrow-img" src="./assets/arrow.png" alt="">
                
                    <div class="currency-box">
                        <img class="currency-img" src="./assets/dollar.png" alt="logo-moeda-a-converter">
                        <p id="currency-name" class="currency">Dólar americano</p>
                        <p class="currency-value">US$ 0.0</p>
                    </div>
                </section>
            </main>
                             <!-- link script -->
            <script src="./script.js"></script>
        </body>
   
    </html>
